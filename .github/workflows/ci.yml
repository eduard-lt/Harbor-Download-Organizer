name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: python tools/version.py check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - run: npm ci
        working-directory: packages/ui
      - run: npm run lint && npm run build && npm run coverage
        working-directory: packages/ui
      - run: npx playwright install --with-deps chromium
        working-directory: packages/ui
      - run: npm run e2e
        working-directory: packages/ui
      - run: npm audit --audit-level=moderate
        working-directory: packages/ui
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: packages/ui/dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/ui/playwright-report
  native:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: packages/ui/dist
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file Cargo.lock
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run config_yaml -- -max_total_time=15 -max_len=65536 -rss_limit_mb=1024
        working-directory: crates/core/fuzz
      - run: cargo fuzz run rule_yaml -- -max_total_time=15 -max_len=65536 -rss_limit_mb=1024
        working-directory: crates/core/fuzz
  ci-success:
    if: always()
    needs: [format, frontend, native, audit, fuzz]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
