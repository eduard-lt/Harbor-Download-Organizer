name: diag macOS signing (temporary)
on:
  push:
    branches: [fix/macos-gatekeeper]
jobs:
  build-and-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: packages/ui
      - name: Universal macOS installer
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm run tauri:build -- --target universal-apple-darwin --bundles dmg -- --locked
        working-directory: packages/ui
      - name: macOS Gatekeeper check
        run: bash tools/check_macos_gatekeeper.sh target/universal-apple-darwin/release/bundle/dmg/*.dmg
