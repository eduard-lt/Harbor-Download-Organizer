name: diag macOS signing (temporary)
on:
  push:
    branches: [fix/macos-gatekeeper]
jobs:
  control:
    runs-on: macos-latest
    steps:
      - name: Control apps vs Harbor
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          check() {
            local app="$1"; echo "===== $app"
            codesign -dv "$app" 2>&1 | grep -E "flags|Signature" || echo "(unsigned)"
            xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$app"
            spctl -a -vvv -t exec "$app" 2>&1 || true
            syspolicy_check distribution "$app" 2>&1 | grep -E "^[A-Z][A-Za-z ]+$|Severity" || true
          }
          mk() {
            local name="$1"; mkdir -p "/tmp/$name.app/Contents/MacOS"
            printf 'int main(){return 0;}' > /tmp/m.c
            clang -arch arm64 -arch x86_64 -o "/tmp/$name.app/Contents/MacOS/$name" /tmp/m.c
            printf '<?xml version="1.0"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>%s</string><key>CFBundleIdentifier</key><string>test.%s</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>' "$name" "$name" > "/tmp/$name.app/Contents/Info.plist"
          }
          mk Plain; check /tmp/Plain.app
          mk Adhoc; codesign -s - --force /tmp/Adhoc.app; check /tmp/Adhoc.app
          mk AdhocRuntime; codesign -s - --force --options runtime /tmp/AdhocRuntime.app; check /tmp/AdhocRuntime.app
          gh release download v2.4.0 -R ${{ github.repository }} -p '*.dmg'
          hdiutil attach -nobrowse -readonly Harbor_2.4.0_universal.dmg -mountpoint /tmp/h >/dev/null
          cp -R /tmp/h/Harbor.app /tmp/Harbor.app; check /tmp/Harbor.app
          sw_vers
