name: Release candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: packages/ui
      - name: Windows installers
        if: runner.os == 'Windows'
        run: npm run tauri:build -- --bundles nsis -- --locked
        working-directory: packages/ui
      - name: Windows startup capture regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test_windows_installer.ps1
      - name: Universal macOS installer
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm run tauri:build -- --target universal-apple-darwin --bundles dmg -- --locked
        working-directory: packages/ui
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
  draft:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Check tag version
        run: |
          python tools/version.py check
          test "${GITHUB_REF_NAME}" = "v$(python tools/version.py show)"
      - name: Candidate notes
        run: |
          echo 'Unsigned release candidate. Review docs/RELEASE.md and complete native install, upgrade, login and signing checks before publication.' > release-notes.md
          git log --pretty=format:'- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" >> release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          body_path: release-notes.md
          files: |
            dist/**/*.exe
            dist/**/*.dmg
          fail_on_unmatched_files: true
