[package]
name = "harbor-tauri-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Tauri wrapper for Harbor UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
harbor-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["full"] }
chrono = { workspace = true, features = ["serde"] }
regex.workspace = true
sha2 = "0.10"
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-service-management = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "objc2-core-services"] }
plist = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }


[dev-dependencies]
tempfile.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
